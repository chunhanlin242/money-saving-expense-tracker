# Deploys to Cloudflare Workers on every push to main.
#
# Why this exists: Claude Code on my phone runs in a cloud sandbox with no
# Cloudflare credentials, so it can't run `wrangler deploy` itself. With this
# workflow, a change made from the phone goes live once it's merged into main.
#
# Needs one repository secret (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  (permissions: Workers Scripts edit, D1 edit, Workers Routes edit)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:      # can also be triggered by hand from the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: false   # never cancel a deploy halfway and leave things half-updated

jobs:
  deploy:
    # This public copy is a showcase; only the private repo holds the deploy token.
    if: github.repository == 'chunhanlin242/travel-money'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
