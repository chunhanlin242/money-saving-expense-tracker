name = "travel-money"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = false

routes = [
  { pattern = "money.example.com", custom_domain = true }
]

# Worker 先跑，由它決定走 API 還是回靜態檔（含 SPA fallback）
[assets]
directory = "./public"
binding = "ASSETS"
# Worker 先跑，才能在碰到靜態檔之前把 /api/* 攔下來
run_worker_first = true
# 沒對應檔案的路徑一律回 app shell（200，不是轉址）。
# 自己在 Worker 裡判斷 404 再 fallback 是行不通的：資產伺服器對 /settings
# 這種路徑會先回 307 試 /settings/，根本走不到 404 那個分支。
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "travel-money"
database_id = "2e03b6ae-7517-4f3d-ae60-8d7a47860a0e"

# 每天 01:30 UTC 更新匯率
[triggers]
crons = ["30 1 * * *"]
